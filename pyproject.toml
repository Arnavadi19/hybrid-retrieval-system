[project]
name = "vietnam-travel-chat"
version = "0.1.0"
description = "Hybrid AI chat system combining Neo4j graph database and Pinecone vector search for intelligent travel queries"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Arnav", email = "arnavdt@gmail.com"}
]
keywords = ["ai", "chatbot", "neo4j", "pinecone", "hybrid-search", "rag"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "neo4j>=5.26.0",
    "openai>=1.54.0",
    "pinecone>=7.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "pyvis>=0.3.2",
    "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []